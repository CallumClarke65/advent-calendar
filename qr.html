<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .qr-container {
      text-align: center;
    }

    .qr-container img {
      width: 300px;
      height: 300px;
    }

    .qr-container p {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #555;
    }

    @media print {
      body {
        height: auto;
      }
    }
  </style>
</head>

<body>
  <div class="qr-container">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://callumclarke65.github.io/advent-calendar/"
      alt="QR code"
    />
    <p>Scan me 🎉</p>
  </div>
</body>
</html>
